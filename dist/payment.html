<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KisanConnect - Payment</title>
  <link rel="stylesheet" crossorigin href="/assets/style-BW3qsaPL.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="flex items-center gap-16">
      <a href="javascript:history.back()" style="color:var(--neutral-700);display:flex;align-items:center;gap:6px;font-weight:500">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><polyline points="15 18 9 12 15 6"/></svg>
        <span data-i18n="back">Back</span>
      </a>
    </div>
    <div class="navbar-actions">
      <button class="voice-btn" onclick="Voice.speakKey('payment_title')" title="Voice Guide"></button>
      <button class="lang-toggle" style="position:static" onclick="App.toggleLang()">हिन्दी</button>
    </div>
  </nav>

  <main style="margin-top:64px;padding:32px 24px;max-width:600px;margin-left:auto;margin-right:auto" class="page-enter">
    <div class="section-header">
      <h2 data-i18n="payment_title">Choose Payment Method</h2>
    </div>

    <!-- Order Summary -->
    <div class="card mb-24" id="orderSummary">
      <h3 style="font-weight:700;margin-bottom:16px" data-i18n="order_summary">Order Summary</h3>
      <div id="summaryItems"></div>
      <div style="border-top:2px solid var(--neutral-100);margin-top:12px;padding-top:12px;display:flex;justify-content:space-between;font-weight:700;font-size:1.2rem">
        <span data-i18n="total">Total</span>
        <span id="summaryTotal">₹0</span>
      </div>
    </div>

    <!-- Payment Methods -->
    <div class="payment-methods" id="paymentMethods">
      <div class="payment-method" onclick="Payment.selectMethod('upi')" data-method="upi">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary-600)" stroke-width="2" width="40" height="40"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        <h4 data-i18n="pay_upi">UPI Payment</h4>
        <p>Google Pay, PhonePe, BHIM</p>
      </div>
      <div class="payment-method" onclick="Payment.selectMethod('wallet')" data-method="wallet">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--secondary-600)" stroke-width="2" width="40" height="40"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>
        <h4 data-i18n="pay_wallet">Wallet</h4>
        <p>Paytm, Amazon Pay</p>
      </div>
      <div class="payment-method" onclick="Payment.selectMethod('cod')" data-method="cod">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-600)" stroke-width="2" width="40" height="40"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <h4 data-i18n="pay_cod">Cash on Delivery</h4>
        <p>Pay when you receive</p>
      </div>
      <div class="payment-method" onclick="Payment.selectMethod('bank')" data-method="bank">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary-700)" stroke-width="2" width="40" height="40"><path d="M3 21h18"/><path d="M3 10h18"/><path d="M12 3a9 9 0 0 0-9 9"/><path d="M12 3a9 9 0 0 1 9 9"/><path d="M3 10l9-7 9 7"/></svg>
        <h4 data-i18n="pay_bank">Bank Transfer</h4>
        <p>NEFT, IMPS</p>
      </div>
    </div>

    <!-- Pay Button -->
    <button class="btn btn-primary btn-block btn-lg mt-24" id="payBtn" onclick="Payment.processPayment()" disabled style="opacity:0.5">
      <span data-i18n="pay_now">Pay Now</span>
    </button>

    <!-- Transaction History -->
    <div class="card mt-24">
      <h3 style="font-weight:700;margin-bottom:16px" data-i18n="payment_history">Payment History</h3>
      <div id="txnHistory"></div>
    </div>
  </main>

  <!-- Payment Success Overlay -->
  <div class="payment-success-overlay hidden" id="paymentSuccess">
    <div class="payment-success-modal">
      <div class="payment-success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" width="40" height="40"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h2 style="color:var(--primary-700);font-size:1.5rem;margin-bottom:8px" data-i18n="pay_success">Payment Successful!</h2>
      <p style="color:var(--neutral-500);margin-bottom:8px" data-i18n="transaction_id">Transaction ID</p>
      <p style="font-weight:700;font-size:1.1rem;margin-bottom:24px" id="txnId">TXN004</p>
      <a href="tracking.html" class="btn btn-primary btn-block" data-i18n="logistics">Track Order</a>
      <a href="consumer.html" class="btn btn-ghost btn-block mt-8" data-i18n="browse_market">Continue Shopping</a>
    </div>
  </div>

  <script src="data/translations.js"></script>
  <script src="data/demo.js"></script>
  <script src="js/app.js"></script>
  <script src="js/payment.js"></script>
</body>
</html>
